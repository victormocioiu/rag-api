[project]
name = "rag-api"
version = "0.1.0"
description = "Persist and search. The only service that touches Postgres."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
# no type stubs / py.typed marker upstream
module = ["asyncpg.*"]
ignore_missing_imports = true
